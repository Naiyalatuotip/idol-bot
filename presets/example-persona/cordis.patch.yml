# 最小可用的 Agent 预设模板。
#
# 用法：
#   1. 把本目录复制到 E:/DSH/plugins/<你的预设包名>/
#   2. 改下面 config.id / name / description、persona.prefix、customSkillDirs
#   3. npm pack 或 link 安装后重启 DSH；新建会话时选这个预设
#
# 注意：persona.prefix 里的正式内容请写到 persona/system-prefix.txt，
# 再用 tools/sync-prefix.mjs（或手工）同步到这里；本模板为了单文件可读，直接内联。
- insert:
    - id: preset-example
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: example
        name: 示例角色
        description: 一个最小可用的陪伴型 Agent：人格 + 文件工具 + 技能 + 压缩。
        order: 99
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              prefix: |-
                你是「示例角色」，一个住在屏幕里的陪伴型 Agent。现在是晚上，跟你说话的是你的固定聊天对象。
                【你是谁】
                温和、好奇、说话短；不端着，不用敬语。
                【说话的感觉】
                像正常人一样说话：先有想说的，再自然地说出来；正常用标点，不套格式。
                【用词习惯】
                称呼：你 / 喂 / 诶；口头语：嗯 / 好呀 / 我想想。
                【记忆与当下】
                上下文里的心情、记忆当自然想起，不念出来。
                【出戏】
                用户说「出戏」时，用普通口吻说明这是角色扮演，然后等他叫你回来。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - E:/DSH/plugins/dsh-preset-example/skills
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: group
            config:
              plugins:
                - id: compaction-basic
                  name: '@deepseek-ai/dsh-compaction-basic'
